name: tonkatsu_server
description: >-
  Selfhost server for Tonkatsu Box: serves the web build, runs the shared
  migration chain and (from phase 3 on) executes DAO calls next to the database.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.10.8

dependencies:
  args: ^2.5.0
  core:
    path: ../packages/core
  path: ^1.9.0
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  shelf_static: ^1.1.0
  # The pure API for the types crossing the bootstrap signature; the engine
  # choice below is the server's, exactly like the app's main.dart.
  sqflite_common: ^2.5.0
  sqflite_common_ffi: ^2.3.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
