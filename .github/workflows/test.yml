name: Tests

on:
  # A release branch takes direct pushes, but its own PR to main re-runs on
  # every one of them — watching the push too would double every check.
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # packages/core and server resolve separately: the root package_config has
      # no `test` entry, so without this their test/ files fail to analyze.
      - name: Install dependencies
        run: |
          flutter pub get
          dart pub get --directory packages/core
          dart pub get --directory server

      # A stale stub still compiles until a signature changes, so the layer is
      # regenerated here and required to come out byte-identical.
      - name: Check the RPC layer is up to date
        working-directory: packages/core
        run: |
          dart run tool/generate_rpc.dart
          git diff --exit-code -- lib/rpc/generated

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings

  test-packages:
    name: Test core and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          dart pub get --directory packages/core
          dart pub get --directory server

      - name: Run core package tests
        working-directory: packages/core
        run: dart test

      - name: Run server tests
        working-directory: server
        run: dart test

  test-app:
    name: Test app (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The app suite is the long pole, so it is spread over several runners;
      # --shard-index is zero-based and the file split is deterministic.
      - name: Run app tests
        run: flutter test --total-shards 4 --shard-index ${{ matrix.shard }}
